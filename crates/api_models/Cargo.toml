[package]
name = "api_models"
description = "Request/response models for the `router` crate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
license.workspace = true

[features]
errors = ["dep:actix-web", "dep:reqwest"]
dummy_connector = ["euclid/dummy_connector", "common_enums/dummy_connector"]
payouts = ["common_enums/payouts"]
frm = []
olap = []
openapi = ["common_enums/openapi", "olap", "dummy_connector"]
v1 = ["common_utils/v1"]
v2 = [
    "common_types/v2",
    "common_utils/v2",
    "tokenization_v2",
    "dep:reqwest",
    "revenue_recovery",
]
dynamic_routing = []
control_center_theme = ["dep:actix-web", "dep:actix-multipart"]
revenue_recovery = ["dep:actix-multipart"]
tokenization_v2 = ["common_utils/tokenization_v2"]

[dependencies]
actix-multipart = { version = "0.6.2", optional = true }
actix-web = { version = "4.11.0", optional = true }
csv = "1.3"
error-stack = "0.4.1"
mime = "0.3.17"
rust_decimal = "1.37"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
strum = { version = "0.26", features = ["derive"] }
tempfile = "3.8"
time = { version = "0.3.41", features = ["serde", "serde-well-known", "std"] }
url = { version = "2.5.4", features = ["serde"] }
utoipa = { version = "4.2.3", features = [
    "preserve_order",
    "preserve_path_order",
] }
nutype = { version = "0.4.3", features = ["serde"] }
deserialize_form_style_query_parameter = "0.2.2"
superposition_types = "0.115.5"

# First party crates
cards = { version = "0.1.0", path = "../cards" }
common_enums = { version = "0.1.0", path = "../common_enums" }
common_types = { version = "0.1.0", path = "../common_types" }
common_utils = { version = "0.1.0", path = "../common_utils" }
euclid = { version = "0.1.0", path = "../euclid" }
hyperswitch_masking = { version = "0.0.1", default-features = false, features = [
    "alloc",
    "serde",
    "time",
] }
router_derive = { version = "0.1.0", path = "../router_derive" }
smithy = { version = "0.1.0", path = "../smithy" }
smithy-core = { version = "0.1.0", path = "../smithy-core" }

# `reqwest`'s async client pulls in `tokio` with its `net` feature, which pulls
# in `mio` -- unsupported on wasm32-unknown-unknown. Not currently reachable
# from euclid_wasm's build (this dep only activates via the "errors"/"v2"
# features, neither of which euclid_wasm enables today), but it is `optional`
# rather than absent, so a future feature addition to euclid_wasm's own
# feature set could silently re-introduce this path. Scoped out at the source,
# same pattern as common_utils's own reqwest gate and cards' router_env gate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.11.27", optional = true }

[lints]
workspace = true
