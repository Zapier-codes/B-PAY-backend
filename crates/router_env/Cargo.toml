[package]
name = "router_env"
description = "Environment of payment router: logger, basic config, its environment awareness."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
license.workspace = true

[dependencies]
cargo_metadata = "0.18.1"
config = { version = "0.14.1", features = ["toml"] }
deja = { git = "https://github.com/juspay/deja", rev = "de0a42a42248fc22722bc5a385d9fa6a39449e91", optional = true, default-features = false }
deja-core = { git = "https://github.com/juspay/deja", rev = "de0a42a42248fc22722bc5a385d9fa6a39449e91", optional = true }
error-stack = "0.4.1"
gethostname = "0.4.3"
# Optional (deja-only): types the captured request/response payloads as `Secret`
# so bodies/headers are redacted in Debug/logs. Feature-off it is absent, so the
# default build is byte-identical.
hyperswitch_masking = { version = "0.0.1", optional = true }
opentelemetry = { version = "0.27.1", default-features = false, features = ["internal-logs", "metrics", "trace"] }
opentelemetry-aws = { version = "0.15.0", default-features = false, features = ["internal-logs", "trace"] }
rustc-hash = "1.1"
serde = { version = "1.0.219", features = ["derive"] }
bytes = { version = "1.10.1", optional = true }
serde_json = "1.0.140"
serde_path_to_error = "0.1.17"
strum = { version = "0.26.3", features = ["derive"] }
time = { version = "0.3.41", default-features = false, features = ["formatting"] }
tracing = { workspace = true }
actix-web = { version = "4.11.0", optional = true }
tracing-actix-web = { version = "0.7.18", features = ["opentelemetry_0_27", "uuid_v7"], optional = true }
tracing-appender = { version = "0.2.3" }
tracing-attributes = "0.1.28"
tracing-opentelemetry = { version = "0.28.0", default-features = false }
tracing-subscriber = { version = "0.3.19", default-features = true, features = ["env-filter", "json", "registry"] }
uuid = { version = "1.17.0", features = ["v7"], optional = true }
vergen = { version = "8.3.2", optional = true, features = ["cargo", "git", "git2", "rustc"] }

# `opentelemetry-otlp`'s "grpc-tonic" feature pulls `tonic`/`hyper`, and
# `opentelemetry_sdk`'s "rt-tokio-current-thread" feature requires a `tokio`
# runtime directly -- both, along with the plain `tokio` dependency itself,
# pull in `mio`, which does not support wasm32-unknown-unknown. Nothing that's
# actually reachable for a wasm32 build uses this crate's telemetry pipeline
# (`logger::setup`, gated below) -- only `logger`'s plain tracing macros,
# `env`, `metrics`'s in-process counters, and `cargo_workspace` are used from
# a wasm32 target, none of which touch these three. Scoped out at the true
# source rather than patched around downstream, same pattern already used in
# this file for the `wasm32`-only `uuid` override in `common_utils`, and the
# same class of fix as this crate's own `actix_web`/`request_id`/`root_span`
# feature-gating above.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.48.0" }
opentelemetry-otlp = { version = "0.27.0", default-features = false, features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.27.1", default-features = false, features = ["rt-tokio-current-thread", "metrics", "trace"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
cargo_metadata = "0.18.1"
vergen = { version = "8.3.2", features = ["cargo", "git", "git2", "rustc"], optional = true }

[features]
default = ["actix_web", "payouts"]
actix_web = ["dep:actix-web", "tracing-actix-web", "dep:uuid"]
log_custom_entries_to_extra = []
log_extra_implicit_fields = []
log_active_span_json = []
deja = ["dep:bytes", "dep:deja", "dep:deja-core", "dep:hyperswitch_masking"]
payouts = []

[lints]
workspace = true
