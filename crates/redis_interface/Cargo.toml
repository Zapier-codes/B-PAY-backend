[package]
name = "redis_interface"
description = "A user-friendly interface to Redis"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
license.workspace = true

[features]
default = ["redis-rs"]
fred = ["dep:fred", "deja?/fred"]
redis-rs = ["dep:redis", "deja?/redis-rs"]
# Postgres (Supabase) backend: a drop-in replacement for the Redis backends that
# keeps the exact same public API but stores everything in `pg_kv_cache` /
# `pg_pubsub_payload` (migrations/2026-09-11-120000_add_postgres_kv_replacement).
# `redis` is still pulled in, but only as a *codec*: its `ToRedisArgs` /
# `FromRedisValue` traits are what every existing call site is written against,
# so values are encoded/decoded through them and no Redis connection is ever made.
postgres = ["dep:redis", "dep:diesel", "dep:bb8", "dep:async-bb8-diesel"]
multitenancy_fallback = []
deja = ["common_utils/deja", "dep:deja", "dep:serde_json"]
metrics = ["dep:router_env"]

[dependencies]
error-stack = "0.4.1"
futures = "0.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", optional = true }
thiserror = "1.0.69"
tokio = "1.48.0"
tokio-stream = { version = "0.1.17", features = ["sync"] }
tracing = { workspace = true }

# Exactly one backend (fred, redis-rs or postgres) must be active at compile time
redis = { version = "1.2.0", optional = true, features = [
    "tokio-comp", "cluster-async", "streams", "script", "connection-manager"
]}
fred = { version = "8.0.6", optional = true, features = [
    "metrics", "partial-tracing", "subscriber-client"
]}

# Postgres backend only
diesel = { version = "2.2.10", default-features = false, features = ["postgres"], optional = true }
bb8 = { version = "0.8.6", optional = true }
async-bb8-diesel = { version = "0.2.1", optional = true }

# First party crates
common_utils = { version = "0.1.0", path = "../common_utils", features = ["async_ext"] }
deja = { git = "https://github.com/juspay/deja", rev = "de0a42a42248fc22722bc5a385d9fa6a39449e91", optional = true, default-features = false, features = ["error-stack"] }
router_env = { version = "0.1.0", path = "../router_env", optional = true }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
