name: Build and Publish Docker Image

# Builds this fork's multi-stage Dockerfile (already Hyperswitch + our own
# changes combined at compile time), publishes it to GHCR, then tells Render
# to redeploy the new image via its deploy hook.
#
# Required repo configuration (Settings -> Secrets and variables -> Actions):
#   RENDER_DEPLOY_HOOK_URL   - the deploy hook URL from the Render service's
#                              "Settings" tab. Treat as a secret: anyone with
#                              this URL can trigger a deploy.
#
# No registry credentials need to be added manually - GHCR authenticates with
# the workflow's own automatically-issued GITHUB_TOKEN.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Rust build of this workspace needs more memory than the hosted runner's
      # RAM at its peak (see the OOM note on the build step below). Swap turns a
      # hard OOM kill into a slowdown. Best-effort: a failure here must not block.
      - name: Add swap
        continue-on-error: true
        run: |
          df -h /mnt
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Industry-standard tagging: branch name, short commit SHA (always
      # traceable/rollback-able), semver on tag pushes, and `latest` only for
      # the default branch - handled declaratively by metadata-action rather
      # than hand-rolled shell.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # `release` (fat LTO, codegen-units=1) runs the hosted runner out of memory
          # ("ResourceExhausted: cannot allocate memory" after ~30 min, at c31be2e13
          # and d07e38097). `release-fast` is this repo's own lower-memory profile
          # (no LTO, 16 codegen units, see Cargo.toml). Switch back to `release` on a
          # larger runner if LTO's smaller/faster binary is ever wanted.
          # BUILD_JOBS=2: `release-fast` alone still ran out of memory at 0a7e152af
          # (after ~21 min), so also cap the number of parallel rustc processes.
          build-args: |
            CARGO_BUILD_PROFILE=release-fast
            BUILD_JOBS=2
            VERSION_FEATURE_SET=v1

      - name: Trigger Render deploy hook
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set - skipping deploy trigger." >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
