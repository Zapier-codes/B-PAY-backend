[default.extend-words]
nd = "nd" # closure/local binding name used pervasively in unified_connector_service transformers, not "and"
fo = "fo" # closure/local binding name (e.g. `Ok(fo) => ...`) in hyperswitch_interfaces gateway.rs, not a typo
tak = "tak" # lowercase form of the Thailand state abbreviation "Tak", used as a match-arm string literal
threed = "threed" # substring of "threeds" (3D Secure), matches existing ThreedsInvokeAndCompleteAutorize exception
unparseable = "unparseable" # valid alternate spelling of "unparsable", used deliberately in error messages
UNSUPPORT = "UNSUPPORT" # substring the tool splits out of UNSUPPORTED_ERROR_MESSAGE / UNSUPPORTED FEATURES comments
HSA = "HSA" # Health Savings Account, a real card subtype in card_metadata
RTO = "RTO" # Gigadat connector transaction-type code
